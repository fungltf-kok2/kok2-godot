<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">

  <title>GKK2 重製測試｜安裝方法及其他資訊</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #161815; color: #f3eee4; line-height: 1.65; }
    body { margin: 0; }
    main { max-width: 40rem; margin: auto; padding: clamp(2rem, 7vw, 5rem) 1.5rem 3rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.15; margin: 0 0 .7rem; }
    h2 { font-size: 1.25rem; margin: 0 0 .6rem; }
    p, ol, ul { margin: 0 0 .9rem; }
    li + li { margin-top: .45rem; }
    a { color: #efc484; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #ffe1a9; outline-offset: 4px; border-radius: .2rem; }
    .download { display: inline-block; background: #edc080; color: #20170f; border-radius: .35rem; padding: .58rem 1.05rem; font-weight: 700; text-decoration: none; }
    .download:hover { background: #ffe0ac; }
    .muted { color: #c8c7ba; }
    section { border-top: 1px solid #59503e; margin-top: 1.7rem; padding-top: 1.25rem; }
    code { color: #f4d49e; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GKK2 重製測試</h1>
      <p class="muted">Windows 64 位元</p>
      <a class="download" href="#install">下載 Windows 版</a>
    </header>
    <section aria-labelledby="install">
      <h2 id="install">首次安裝</h2>
      <ol>
        <li>下載以下三個 ZIP 檔案。
          <ul>
            <li><a href="https://github.com/fungltf-kok2/kok2-godot/releases/download/v0.4.2/GKK2-Core-0.4.2-Windows.zip">Game Core</a>（約 118 MB）</li>
            <li><a href="https://github.com/fungltf-kok2/kok2-godot/releases/download/v0.4.0/GKK2-Pack1-v2.zip">Pack1</a>（約 176 MB）</li>
            <li><a href="https://github.com/fungltf-kok2/kok2-godot/releases/download/v0.4.2/GKK2-Pack2-v3.zip">Pack2</a>（約 1.5 GB）</li>
          </ul>
        </li>
        <li>將三個 ZIP 解壓至同一位置，合併解壓後的 <code>GKK2</code> 資料夾。</li>
        <li>開啟 <code>GKK2\GKK2.exe</code>，於登入畫面註冊帳號或登入。</li>
      </ol>
    </section>
    <section aria-labelledby="update">
      <h2 id="update">更新遊戲</h2>
      <p>請先關閉遊戲，再按該版本的發佈說明更新。檔名相同的資源包可以沿用。</p>
    </section>
  </main>
