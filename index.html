<script>
  const setOpen = (button, open) => {
    button.setAttribute('aria-expanded', String(open));
    button.closest('.instruction').dataset.open = String(open);
    document.getElementById(button.getAttribute('aria-controls')).inert = !open;
  };
  const toggles = [...document.querySelectorAll('.instruction-toggle')];
  for (const button of toggles) {
    button.addEventListener('click', () => setOpen(button, button.getAttribute('aria-expanded') !== 'true'));
  }
  const panels = [...document.querySelectorAll('.instruction-slide')];
  let latestSelection = 0;
  for (const action of document.querySelectorAll('.card-action')) {
    const targetId = action.getAttribute('aria-controls');
    const target = document.getElementById(targetId);
    const heading = document.getElementById(target.getAttribute('aria-labelledby'));
    const select = async (moveFocus) => {
      const selection = ++latestSelection;
      for (const toggle of toggles) setOpen(toggle, toggle === heading);
      if (moveFocus) heading.focus({preventScroll: true});
      // The other panel can collapse above this heading and change its position.
      const transitions = panels.flatMap(panel => panel.getAnimations());
      await Promise.allSettled(transitions.map(transition => transition.finished));
      if (selection === latestSelection && heading.getAttribute('aria-expanded') === 'true') {
        heading.closest('.instruction').scrollIntoView({block: 'start'});
      }
    };
    action.addEventListener('click', () => select(true));
    action.closest('section').querySelector('.download').addEventListener('click', () => select(false));
  }
</script>
