<section id="launcher-announcements"><h2>系統公告</h2><article><h3>0.4.9 更新</h3><p>啟動器加入自動清理更新暫存功能</p></article><article><h3>0.4.8 更新</h3><p>修正舊安裝更新後，狂戰士仍無法裝備重武器的問題。</p></article><article><h3>0.4.7 更新</h3><p>修正狂戰士無法裝備重武器的問題。啟動器可捲動查看歷次更新記錄。</p></article><article><h3>0.4.6 更新</h3><p>新增自訂按鍵功能；改善攻擊追擊，減少「目標距離過遠」及「目標受阻」的情況；提升戰士普攻傷害；移除啟動器多開限制。</p></article><article><h3>0.4.5 更新</h3><p>登入及註冊時會自動選用較快的連線。此版本亦修正好友名單、聊天輸入及國家傳送門。</p></article><article><h3>0.4.2 更新</h3><p>修正部分 NPC 的頭部貼圖。套用校準後的場景光照，並更新預烘陰影及 VoxelGI 資料。</p></article></section>
